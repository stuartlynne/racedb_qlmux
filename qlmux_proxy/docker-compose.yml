

services:

    qlmux_proxy:
        image: ${IMAGE}
        privileged: true
        cap_add:
            - NET_ADMIN # Allows the container to manage network interfaces
            - NET_RAW   # Allows the container to create raw sockets
        container_name: ${CONTAINER}
        hostname: ${HOSTNAME}
        restart: always
        network_mode: host
        logging:
          driver: "json-file"
          options:
            max-size: "10m"
            max-file: "3"
        labels:
            - "traefik.enable=false"
        environment:
            PYTHONUNBUFFERED: 1
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - /etc/timezone:/etc/timezone:ro
